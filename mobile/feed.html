<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - Luma Shorts</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" href="feed-styles.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="logo.png" alt="Luma Shorts Logo" class="logo-image">
        <a href="upload.html" class="upload-btn">Upload</a>
    </nav>

    <!-- Feed Container -->
    <div class="feed" id="feed"></div>

<script>
    var feedUrl = 'https://lumaprojects.github.io/shorts/feed.json';

    function loadFeed() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', feedUrl, true);

        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var videos = JSON.parse(xhr.responseText);
                        renderFeed(videos);
                    } catch (e) {
                        showError();
                    }
                } else {
                    showError();
                }
            }
        };

        xhr.send();
    }

    function renderFeed(videos) {
        var feedContainer = document.getElementById('feed');

        for (var i = 0; i < videos.length; i++) {
            var video = videos[i];

            var card = document.createElement('div');
            card.className = 'video-card';

            var videoEl = document.createElement('video');
            videoEl.src = video.videoUrl;
            videoEl.controls = true;
            card.appendChild(videoEl);

            var userInfo = document.createElement('div');
            userInfo.className = 'user-info';

            var avatar = document.createElement('img');
            avatar.src = video.avatarUrl;
            avatar.alt = video.uploader;
            userInfo.appendChild(avatar);

            var textContainer = document.createElement('div');

            var username = document.createElement('div');
            username.className = 'username';
            username.appendChild(document.createTextNode(video.uploader));

            var description = document.createElement('div');
            description.className = 'description';
            description.appendChild(document.createTextNode(video.title));

            textContainer.appendChild(username);
            textContainer.appendChild(description);
            userInfo.appendChild(textContainer);

            card.appendChild(userInfo);

            feedContainer.appendChild(card);
        }
    }

    function showError() {
        var feedContainer = document.getElementById('feed');
        feedContainer.innerHTML = '<p style="color:red;">Failed to load feed.</p>';
    }

    loadFeed();
</script>
</body>
</html>
